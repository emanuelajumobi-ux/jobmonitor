# Beispiel-Firmenliste (Raum Köln). Neue Nutzer starten leer und bekommen Vorschläge in der App.
# Firmen und Hochschul-Stellenbörsen.
# Neue Firma: Block kopieren, name + kategorie + karriereseite_url ausfüllen, ats leer lassen.
# Felder:
#   kategorie: msp | systemhaus | beratung | energie | bank | versicherung | konzern | pruefung | medien | hochschule
#   karriereseite_url: Seite mit der Stellenliste (oder Karriere-Startseite)
#   ats: wird automatisch erkannt (personio, greenhouse, lever, workday, jsonld, ...) – leer lassen
#   ats_id: z. B. Personio-Subdomain, wird automatisch gesetzt
#   Von Hand gesetzt (öffentliche Listen, freigegeben 02.11.2026, siehe jobmonitor/sources/ats/oeffentlich.py):
#     ats: dvinci + ats_id: <firma>.dvinci-hr.com · ats: successfactors + ats_id: Such-URL ohne q=
#     ats: phenom + ats_id: Basis-URL (…/eu/de) · ats: eingebettet (Liste steckt in der Karriereseite)
#     ats: sitemap + ats_id: Stellen-Sitemap aus der robots.txt
#   abruf: nur_initiativ = keine Stellen abfragen (kommen über die Bundesagentur), nur Initiativ-Check
#   initiativ: moeglich ja|nein|unbekannt, url, zuletzt_geprueft (wird automatisch gepflegt;
#              ein fehlender Link setzt nie "nein" – das trägst du bei Bedarf selbst ein)
#   aktiv: false schaltet einen Eintrag ab
#   match_namen + warnhinweis: Hinweis an jede Stelle hängen, deren Firmenname eines der Wörter enthält
# Live geprüft am 31.10.2026.

