# Lernvorschläge zur Lücken-Auswertung (Oberfläche → Lücken). Schlüssel = Begriff aus config.yaml → fit.begriffe.
# Je Begriff Vorschläge: art zertifikat oder projekt, name, zusatz (kurz). Ein Klick auf „Als geplant übernehmen“
# trägt den Vorschlag mit status: geplant und im_cv: false in cv/cv_master.yaml ein. Geplantes zählt nicht
# für den Fit; erst wenn du es auf erreicht/in_arbeit setzt (und im_cv: true), steigt dein Fit.
# Prüfungsnamen, Preise und Voraussetzungen ändern sich: vor dem Buchen auf der Anbieterseite nachsehen.
# Du kannst die Liste frei ergänzen. Nichts Persönliches hier eintragen.

Kubernetes:
