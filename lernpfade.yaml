  - {art: zertifikat, name: "CKA – Certified Kubernetes Administrator", zusatz: "praktische Prüfung, nach ersten Projekten"}
  - {art: projekt, name: "Kubernetes-Cluster im Homelab (k3s)", zusatz: "k3s auf Proxmox-VMs, eine Web-App mit Ingress, Secrets und Monitoring deployen", technologien: [Kubernetes, Docker, Linux]}

